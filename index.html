<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개인 자산 관리 (PFM)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #f8fafc; color: #0f172a; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .card { background: white; border-radius: 0.75rem; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1); padding: 1.5rem; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function Dashboard() {
      return (
        <div className="space-y-6">
          <div className="bg-white p-4 rounded-xl shadow-sm border flex justify-between items-center">
            <h2 className="font-bold text-lg">📊 내 자산 요약</h2>
            <div className="text-sm font-semibold text-blue-600 bg-blue-50 px-4 py-2 rounded-lg">이번 달 요약</div>
          </div>
          
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div className="card"><div className="text-sm text-slate-500">총 순자산</div><div className="text-2xl font-bold">₩ 45,231,000</div></div>
            <div className="card"><div className="text-sm text-slate-500">수입 & 저축</div><div className="text-2xl font-bold">₩ 3,150,000</div></div>
            <div className="card"><div className="text-sm text-slate-500">당기 지출</div><div className="text-2xl font-bold text-red-500">₩ 1,240,000</div></div>
            <div className="card"><div className="text-sm text-slate-500">저축률</div><div className="text-2xl font-bold text-emerald-500">31.7%</div></div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="card">
              <h3 className="font-semibold mb-4 text-lg">📈 지출 예산 소진율</h3>
              <div className="space-y-4">
                <div>
                  <div className="flex justify-between text-sm mb-1"><span>식비 (40만 원 / 50만 원)</span><span className="font-bold text-red-500">80%</span></div>
                  <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden"><div className="bg-red-500 h-full w-[80%]"></div></div>
                </div>
                <div>
                  <div className="flex justify-between text-sm mb-1"><span>교통비 (10만 원 / 15만 원)</span><span className="font-bold text-blue-500">66%</span></div>
                  <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden"><div className="bg-blue-500 h-full w-[66%]"></div></div>
                </div>
                <div>
                  <div className="flex justify-between text-sm mb-1"><span>여가 (15만 원 / 30만 원)</span><span className="font-bold text-emerald-500">50%</span></div>
                  <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden"><div className="bg-emerald-500 h-full w-[50%]"></div></div>
                </div>
              </div>
            </div>
            
            <div className="card">
              <h3 className="font-semibold mb-4 text-lg">💡 최근 지출 내역</h3>
              <ul className="space-y-3">
                <li className="flex justify-between items-center p-3 bg-slate-50 rounded-lg">
                  <div><div className="font-bold">스타벅스 강남점</div><div className="text-xs text-slate-500">식비 > 카페</div></div>
                  <div className="font-bold text-red-500">- 4,500 원</div>
                </li>
                <li className="flex justify-between items-center p-3 bg-slate-50 rounded-lg">
                  <div><div className="font-bold">지하철 정기권</div><div className="text-xs text-slate-500">고정비 > 교통</div></div>
                  <div className="font-bold text-red-500">- 62,000 원</div>
                </li>
                <li className="flex justify-between items-center p-3 bg-slate-50 rounded-lg">
                  <div><div className="font-bold">월급 (회사)</div><div className="text-xs text-slate-500">수입 > 급여</div></div>
                  <div className="font-bold text-blue-600">+ 3,000,000 원</div>
                </li>
              </ul>
            </div>
          </div>
        </div>
      );
    }

    function Transactions() {
      return (
        <div className="card space-y-4">
          <h2 className="font-bold text-xl mb-4">💸 거래 내역 관리</h2>
          <table className="w-full text-sm text-left">
            <thead className="bg-slate-50 text-slate-500">
              <tr><th className="p-3">일시</th><th className="p-3">가맹점</th><th className="p-3 text-right">금액</th></tr>
            </thead>
            <tbody className="divide-y">
              <tr><td className="p-3">2026.10.17</td><td className="p-3">스타벅스</td><td className="p-3 font-bold text-red-500 text-right">-4,500원</td></tr>
              <tr><td className="p-3">2026.10.18</td><td className="p-3">월급</td><td className="p-3 font-bold text-blue-500 text-right">+3,000,000원</td></tr>
            </tbody>
          </table>
        </div>
      );
    }

    function App() {
      const [currentTab, setCurrentTab] = useState('dashboard');

      const renderContent = () => {
        if (currentTab === 'dashboard') return <Dashboard />;
        if (currentTab === 'transactions') return <Transactions />;
        return <div className="card text-center py-20 text-slate-500">🚧 아직 준비 중인 메뉴입니다.</div>;
      };

      return (
        <div className="flex h-screen overflow-hidden bg-slate-50">
          <aside className="w-64 bg-white border-r h-full flex flex-col hidden md:flex">
            <div className="p-6 font-bold text-2xl text-blue-600">PFM App</div>
            <nav className="flex-1 px-4 space-y-2">
              <button onClick={() => setCurrentTab('dashboard')} className={`w-full text-left px-4 py-3 rounded-lg font-medium transition-colors ${currentTab === 'dashboard' ? 'bg-blue-50 text-blue-600' : 'text-slate-600 hover:bg-slate-50'}`}>📊 대시보드</button>
              <button onClick={() => setCurrentTab('transactions')} className={`w-full text-left px-4 py-3 rounded-lg font-medium transition-colors ${currentTab === 'transactions' ? 'bg-blue-50 text-blue-600' : 'text-slate-600 hover:bg-slate-50'}`}>💸 거래 내역</button>
              <button onClick={() => setCurrentTab('assets')} className={`w-full text-left px-4 py-3 rounded-lg font-medium transition-colors ${currentTab === 'assets' ? 'bg-blue-50 text-blue-600' : 'text-slate-600 hover:bg-slate-50'}`}>💰 자산 포트폴리오</button>
            </nav>
          </aside>

          <main className="flex-1 overflow-y-auto p-4 md:p-8 mb-16 md:mb-0">
            {renderContent()}
          </main>
          
          <nav className="md:hidden fixed bottom-0 w-full bg-white border-t flex justify-around p-3 z-50 shadow-[0_-5px_10px_rgba(0,0,0,0.05)]">
            <button onClick={() => setCurrentTab('dashboard')} className={`flex flex-col items-center font-medium text-xs gap-1 ${currentTab === 'dashboard' ? 'text-blue-600' : 'text-slate-400'}`}><span className="text-xl">📊</span>대시보드</button>
            <button onClick={() => setCurrentTab('transactions')} className={`flex flex-col items-center font-medium text-xs gap-1 ${currentTab === 'transactions' ? 'text-blue-600' : 'text-slate-400'}`}><span className="text-xl">💸</span>거래내역</button>
            <button onClick={() => setCurrentTab('assets')} className={`flex flex-col items-center font-medium text-xs gap-1 ${currentTab === 'assets' ? 'text-blue-600' : 'text-slate-400'}`}><span className="text-xl">💰</span>자산</button>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
