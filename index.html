<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개인 자산 관리 (PFM)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Recharts -->
  <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>

  <style>
    body { background-color: #f8fafc; color: #0f172a; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .card { background: white; border-radius: 0.75rem; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1); padding: 1.5rem; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, PieChart, Pie, Cell } = window.Recharts;

    // --- 앱 공통 상태 및 상수 ---
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwDFcd00SMa27jSn6ZpluqSZY4YxR2c0WCjYAioo3jq_NPLuliZLzy-CJI8_YdiScob7w/exec";
    
    // --- API 호출 함수 ---
    async function fetchAPI(action, sheetName, data = null) {
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, sheetName, data })
        });
        const result = await response.json();
        if (!result.success) throw new Error(result.error);
        return result.data;
      } catch (err) {
        console.error('API Error:', err);
        return null;
      }
    }

    // --- 대시보드 컴포넌트 ---
    function Dashboard() {
      const flowData = [
        { date: '10.17', income: 0, expense: 45000 },
        { date: '10.18', income: 0, expense: 12000 },
        { date: '10.19', income: 0, expense: 8000 },
        { date: '10.20', income: 3000000, expense: 50000 },
        { date: '10.21', income: 0, expense: 35000 },
      ];
      const catData = [{ name: '식비', value: 400 }, { name: '교통비', value: 300 }, { name: '여가', value: 300 }, { name: '고정비', value: 200 }];
      const COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444'];

      return (
        <div className="space-y-6">
          <div className="bg-white p-4 rounded-xl shadow-sm border flex justify-between items-center">
            <h2 className="font-bold text-lg">📊 내 자산 요약</h2>
            <div className="text-sm font-semibold text-blue-600 bg-blue-50 px-4 py-2 rounded-lg">조회 기간: 2026.10.17 ~ 11.16</div>
          </div>
          
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div className="card"><div className="text-sm text-slate-500">총 순자산</div><div className="text-2xl font-bold">₩ 45,231,000</div></div>
            <div className="card"><div className="text-sm text-slate-500">수입 & 저축</div><div className="text-2xl font-bold">₩ 3,150,000</div></div>
            <div className="card"><div className="text-sm text-slate-500">당기 지출</div><div className="text-2xl font-bold">₩ 1,240,000</div></div>
            <div className="card"><div className="text-sm text-slate-500">저축률</div><div className="text-2xl font-bold">31.7%</div></div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="card lg:col-span-2">
              <h3 className="font-semibold mb-4">수입/지출 추이</h3>
              <div style={{ width: '100%', height: 300 }}>
                <ResponsiveContainer>
                  <LineChart data={flowData}>
                    <CartesianGrid strokeDasharray="3 3" vertical={false} />
                    <XAxis dataKey="date" />
                    <YAxis />
                    <Tooltip />
                    <Line type="monotone" dataKey="income" stroke="#10b981" name="수입" />
                    <Line type="monotone" dataKey="expense" stroke="#ef4444" name="지출" />
                  </LineChart>
                </ResponsiveContainer>
              </div>
            </div>
            <div className="card">
              <h3 className="font-semibold mb-4">카테고리 비중</h3>
              <div style={{ width: '100%', height: 300 }}>
                <ResponsiveContainer>
                  <PieChart>
                    <Pie data={catData} cx="50%" cy="50%" innerRadius={60} outerRadius={80} dataKey="value">
                      {catData.map((e, i) => <Cell key={i} fill={COLORS[i % COLORS.length]} />)}
                    </Pie>
                    <Tooltip />
                  </PieChart>
                </ResponsiveContainer>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- 거래 내역 컴포넌트 ---
    function Transactions() {
      return (
        <div className="card space-y-4">
          <h2 className="font-bold text-xl mb-4">💸 거래 내역 관리</h2>
          <table className="w-full text-sm text-left">
            <thead className="bg-slate-50 text-slate-500">
              <tr><th className="p-3">일시</th><th className="p-3">가맹점</th><th className="p-3">금액</th></tr>
            </thead>
            <tbody className="divide-y">
              <tr><td className="p-3">2026.10.17</td><td className="p-3">스타벅스</td><td className="p-3 font-semibold text-red-500">-4,500원</td></tr>
              <tr><td className="p-3">2026.10.18</td><td className="p-3">급여</td><td className="p-3 font-semibold text-blue-500">+3,000,000원</td></tr>
            </tbody>
          </table>
          <p className="text-xs text-slate-400 mt-4">* 실제 구글 시트 연동 시 여기에 데이터가 뜹니다.</p>
        </div>
      );
    }

    // --- 메인 레이아웃 ---
    function App() {
      const [currentTab, setCurrentTab] = useState('dashboard');

      const renderContent = () => {
        if (currentTab === 'dashboard') return <Dashboard />;
        if (currentTab === 'transactions') return <Transactions />;
        return <div className="card">🚧 개발 중인 메뉴입니다.</div>;
      };

      return (
        <div className="flex h-screen overflow-hidden">
          {/* 사이드바 */}
          <aside className="w-64 bg-white border-r h-full flex flex-col hidden md:flex">
            <div className="p-6 font-bold text-2xl text-blue-600">PFM App</div>
            <nav className="flex-1 px-4 space-y-2">
              <button onClick={() => setCurrentTab('dashboard')} className={`w-full text-left px-4 py-3 rounded-lg font-medium ${currentTab === 'dashboard' ? 'bg-blue-50 text-blue-600' : 'text-slate-600 hover:bg-slate-50'}`}>📊 대시보드</button>
              <button onClick={() => setCurrentTab('transactions')} className={`w-full text-left px-4 py-3 rounded-lg font-medium ${currentTab === 'transactions' ? 'bg-blue-50 text-blue-600' : 'text-slate-600 hover:bg-slate-50'}`}>💸 거래 내역</button>
              <button onClick={() => setCurrentTab('assets')} className={`w-full text-left px-4 py-3 rounded-lg font-medium ${currentTab === 'assets' ? 'bg-blue-50 text-blue-600' : 'text-slate-600 hover:bg-slate-50'}`}>💰 자산 포트폴리오</button>
              <button onClick={() => setCurrentTab('categories')} className={`w-full text-left px-4 py-3 rounded-lg font-medium ${currentTab === 'categories' ? 'bg-blue-50 text-blue-600' : 'text-slate-600 hover:bg-slate-50'}`}>🏷️ 카테고리</button>
            </nav>
          </aside>

          {/* 메인 컨텐츠 영역 */}
          <main className="flex-1 overflow-y-auto p-4 md:p-8">
            {renderContent()}
          </main>
          
          {/* 모바일 탭바 */}
          <nav className="md:hidden fixed bottom-0 w-full bg-white border-t flex justify-around p-3 z-50">
            <button onClick={() => setCurrentTab('dashboard')} className={`font-medium ${currentTab === 'dashboard' ? 'text-blue-600' : 'text-slate-400'}`}>대시보드</button>
            <button onClick={() => setCurrentTab('transactions')} className={`font-medium ${currentTab === 'transactions' ? 'text-blue-600' : 'text-slate-400'}`}>거래내역</button>
            <button onClick={() => setCurrentTab('assets')} className={`font-medium ${currentTab === 'assets' ? 'text-blue-600' : 'text-slate-400'}`}>자산</button>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
